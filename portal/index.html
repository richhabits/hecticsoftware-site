<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' https://hectic-api.forged-landscapes.workers.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-title" content="Hectic"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/site.webmanifest"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ff4d2e"><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/app.css"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Private project page for Hectic Software clients."><title>Your project · Hectic Software</title></head><body><div class="wrap">
<div class="top"><a href="/">HECTIC</a><span class="mono">Private project page</span></div>
<div id="none" hidden><h1>Project not found.</h1><p class="note">Use the private link you received after sending your brief, or <a href="/start/">start a new project</a>.</p></div>
<div id="view" hidden><span class="mono" id="ref"></span><h1 id="title">Your project</h1>
<div class="card"><div class="row" style="justify-content:space-between"><span class="mono">Status</span><span class="pill" id="status"></span></div><div id="steps" class="row"></div></div>
<div class="card" id="quoteCard" hidden><span class="mono">Your quote</span><p id="quote" style="white-space:pre-wrap;color:var(--fg)"></p></div>
<div class="card"><span class="mono">Messages</span><div id="msgs" style="display:grid;gap:10px"></div><form id="mf" class="row"><input id="mi" maxlength="4000" placeholder="Write a message…" aria-label="Message" style="flex:1"><button class="btn">Send</button></form></div>
<div class="card"><span class="mono">Files</span><div id="files" style="display:grid;gap:6px"></div><form id="ff" class="row"><input type="file" id="fi" aria-label="Add a file" style="flex:1"><button class="btn ghost">Upload</button></form><span class="note" id="fnote"></span></div>
<div class="card"><span class="mono">Your brief</span><p id="brief" style="white-space:pre-wrap;color:var(--fg)"></p></div></div>
</div><script src="/config.js"></script><script src="/chat.js?v=6"></script><script>
const token=(location.hash.slice(1)||(()=>{try{return localStorage.getItem('hs-portal')}catch{return''}})()||'');
const order=['new','reviewing','quoted','accepted','in_progress','beta','live'],names={new:'Received',reviewing:'Reviewing',quoted:'Quote sent',accepted:'Accepted',in_progress:'Building',beta:'Beta',live:'Live',closed:'Closed'};
const esc=t=>{const d=document.createElement('span');d.textContent=t;return d};
async function load(){if(token.length!==64){document.getElementById('none').hidden=false;return}
const r=await fetch(HS_API+'/api/portal',{headers:{Authorization:'Bearer '+token}});if(!r.ok){document.getElementById('none').hidden=false;return}
const d=await r.json(),p=d.project;try{localStorage.setItem('hs-portal',token)}catch{}
document.getElementById('view').hidden=false;document.getElementById('ref').textContent=p.id;document.getElementById('title').textContent=(p.company||p.name)+"'s project";
document.getElementById('status').textContent=names[p.status]||p.status;
const st=document.getElementById('steps');st.innerHTML='';order.forEach((o,i)=>{const s=esc(names[o]);s.className='pill';if(i<=order.indexOf(p.status))s.style.borderColor='#ff4d2e';st.appendChild(s)});
if(p.quote){document.getElementById('quoteCard').hidden=false;document.getElementById('quote').textContent=p.quote}
const m=document.getElementById('msgs');m.innerHTML='';if(!d.messages.length)m.appendChild(Object.assign(esc('No messages yet. Romeo will reply here.'),{className:'note'}));
d.messages.forEach(x=>{const e=esc(x.body);e.className='msg '+x.author;m.appendChild(e)});
const fl=document.getElementById('files');fl.innerHTML='';d.files.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent=x.name+' ('+Math.ceil(x.size/1024)+' KB)';b.onclick=async()=>{const fr=await fetch(HS_API+'/api/file?id='+encodeURIComponent(x.id),{headers:{Authorization:'Bearer '+token}});if(!fr.ok)return;const blob=await fr.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};fl.appendChild(b)});
document.getElementById('brief').textContent=[p.project_type,p.platforms&&('Devices: '+p.platforms),p.features&&('Features: '+p.features),p.timeline&&('Launch: '+p.timeline),p.budget&&('Budget: '+p.budget),'',p.description].filter(x=>x!=null).join('\n')}
document.getElementById('mf').onsubmit=async e=>{e.preventDefault();const v=document.getElementById('mi').value.trim();if(!v)return;await fetch(HS_API+'/api/portal/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,body:v})});document.getElementById('mi').value='';load()};
document.getElementById('ff').onsubmit=async e=>{e.preventDefault();const file=document.getElementById('fi').files[0];if(!file)return;if(file.size>10*1024*1024){document.getElementById('fnote').textContent='Files must be under 10 MB.';return}
const fd=new FormData();fd.append('token',token);fd.append('file',file);const r=await fetch(HS_API+'/api/portal/file',{method:'POST',body:fd});const d=await r.json();document.getElementById('fnote').textContent=d.ok?'Uploaded.':'That file type or size isn’t allowed.';load()};
load();
</script></body></html>
